<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pixel Play — probability painting</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <button
      id="toggle"
      class="toggle"
      aria-expanded="false"
      aria-controls="sidebar"
      aria-label="Toggle settings"
    >
      ☰
    </button>
    <aside id="sidebar" hidden>
      <div class="panel-head">
        <h2>Studio</h2>
        <button id="close" class="icon-button" aria-label="Close settings">×</button>
      </div>
      <p id="painter" class="hint">Checking the studio painter…</p>
      <label for="representation">Representation</label>
      <select id="representation">
        <option value="palette">16-color palette</option>
        <option value="hsl">HSL</option>
        <option value="rgb">Binary RGB</option>
        <option value="silhouette">Silhouette</option>
      </select>
      <label for="size">Grid size</label>
      <select id="size">
        <option value="8">8 × 8</option>
        <option value="12">12 × 12</option>
        <option value="16" selected>16 × 16</option>
        <option value="24">24 × 24</option>
        <option value="32">32 × 32</option>
      </select>
      <p class="hint">
        Model keys live on the local helper, in this machine’s environment.
        Nothing here ever sees them.
      </p>
    </aside>
    <main>
      <section id="carousel" aria-label="Paintings">
        <div id="track">
          <div class="frame active empty">
            <div class="canvas-rim"></div>
          </div>
        </div>
      </section>
      <nav id="navigation" aria-label="Image carousel" hidden>
        <button id="previous" aria-label="Previous image">←</button
        ><span id="position"></span
        ><button id="next" aria-label="Next image">→</button>
      </nav>
      <div class="composer">
        <form id="prompt-form" class="prompt-bar">
          <label class="visually-hidden" for="prompt">Prompt</label
          ><textarea
            id="prompt"
            rows="2"
            maxlength="2000"
            placeholder="A painting of…"
            required
          ></textarea
          ><button id="paint" type="submit" aria-label="Generate painting">
            <span>Paint</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 12h14M12 6l6 6-6 6"/></svg>
          </button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
